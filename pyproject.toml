[project]
name = "data-store-agent"
version = "0.1.0"
description = "Independent multi-user AI workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "argon2-cffi>=23,<26",
  "PyYAML>=6,<7",
  "lark-oapi>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "mcp>=1,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "testcontainers[postgres]>=4,<5"]

[project.scripts]
data-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: opt-in PostgreSQL integration tests (isolated test URL or Docker)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/api/*" = ["B008"]
